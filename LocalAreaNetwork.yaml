payload:

  # ==================================
  # Local Domain（本地域名）
  # ==================================

  - DOMAIN-SUFFIX,localhost
  - DOMAIN-SUFFIX,local
  - DOMAIN-SUFFIX,lan
  - DOMAIN-SUFFIX,internal
  - DOMAIN-SUFFIX,home
  - DOMAIN-SUFFIX,host
  - DOMAIN-SUFFIX,invalid

  # IPv6 Local
  - DOMAIN-SUFFIX,ip6-localhost
  - DOMAIN-SUFFIX,ip6-loopback

  # ==================================
  # IPv4 Private / Reserved Network
  # ==================================
  # 0.0.0.0/8
  - IP-CIDR,0.0.0.0/8,no-resolve

  # Private Class A
  - IP-CIDR,10.0.0.0/8,no-resolve

  # Carrier Grade NAT (运营商共享地址)
  - IP-CIDR,100.64.0.0/10,no-resolve

  # Loopback
  - IP-CIDR,127.0.0.0/8,no-resolve

  # Link Local
  - IP-CIDR,169.254.0.0/16,no-resolve

  # Private Class B
  - IP-CIDR,172.16.0.0/12,no-resolve

  # Private Class C
  - IP-CIDR,192.168.0.0/16,no-resolve

  # Benchmark / 测试网络
  - IP-CIDR,198.18.0.0/16,no-resolve

  # Multicast
  - IP-CIDR,224.0.0.0/4,no-resolve


  # ==================================
  # IPv6 Local Network
  # ==================================

  # Loopback
  - IP-CIDR6,::1/128,no-resolve

  # Unique Local Address
  - IP-CIDR6,fc00::/7,no-resolve

  - IP-CIDR6,fd00::/8,no-resolve

  # Link Local
  - IP-CIDR6,fe80::/10,no-resolve

  # ==================================
  # Router Management（路由器管理）
  # ==================================

  # Aruba
  - DOMAIN,instant.arubanetworks.com
  - DOMAIN,setmeup.arubanetworks.com
  # ASUS 华硕
  - DOMAIN,router.asus.com
  - DOMAIN,www.asusrouter.com
  # Xiaomi 小米路由
  - DOMAIN-SUFFIX,miwifi.com
  # HiWiFi 极路由
  - DOMAIN-SUFFIX,hiwifi.com
  # Netgear 网件
  - DOMAIN-SUFFIX,routerlogin.com
  - DOMAIN-SUFFIX,routerlogin.net
  # Tenda 腾达
  - DOMAIN-SUFFIX,tendawifi.com
  # TP-Link
  - DOMAIN-SUFFIX,tplogin.cn
  - DOMAIN-SUFFIX,tplinkwifi.net
  # Mercury 水星
  - DOMAIN,melogin.cn
  # Phicomm 斐讯
  - DOMAIN-SUFFIX,phicomm.me
  # ZTE 中兴
  - DOMAIN-SUFFIX,zte.home
  # China Telecom 电信网关
  - DOMAIN-SUFFIX,router.ctc
  # China Mobile 移动路由
  - DOMAIN-SUFFIX,wifi.cmcc
  # Common Router Alias
  - DOMAIN-SUFFIX,my.router
  - DOMAIN-SUFFIX,p.to
  - DOMAIN-SUFFIX,peiluyou.com
  - DOMAIN-SUFFIX,home.gateway

  # ==================================
  # NAS / Home Device Common Domain
  # ==================================
  # Synology 群晖
  - DOMAIN-SUFFIX,synology.me

  # QNAP 威联通
  - DOMAIN-SUFFIX,qnap.com
  # ==================================
  # mDNS / Local Discovery
  # ==================================
  - DOMAIN-SUFFIX,localdomain
  - DOMAIN-SUFFIX,localhost.localdomain